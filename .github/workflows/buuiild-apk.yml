name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configuration (secrets GitHub)
        working-directory: android
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          printf 'BACKEND_URL=%s\nAPP_TOKEN=%s\n' "$BACKEND_URL" "$APP_TOKEN" > local.properties

      - name: Keystore commun aux 3 apps (optionnel)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shared.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/shared.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilation
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: decision-board-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
